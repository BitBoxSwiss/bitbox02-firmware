# BitBox02 and Nova always use a J-Link probe, including with OpenOCD.
source [find interface/jlink.cfg]
# Upstream SAM E5x/D5x driver, including ATSAMD51J20.
source [find target/atsame5x.cfg]

# Keep the flash work area beyond the RTT control block and buffers.
$_TARGETNAME configure -work-area-phys 0x20002000
adapter speed 4000
