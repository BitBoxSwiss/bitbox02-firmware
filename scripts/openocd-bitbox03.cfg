# The product configuration supplies the board's probe; default to the dev-kit.
if {![info exists PROBE_ADAPTER]} {
    set PROBE_ADAPTER stlink
}
source [find interface/$PROBE_ADAPTER.cfg]

transport select swd

reset_config srst_only connect_assert_srst
#reset_config none

source [find target/stm32u5x.cfg]

cortex_m reset_config sysresetreq

# set working area beyond the RTT buffers so they don't get clobbered
set _TARGETNAME [target current]
$_TARGETNAME configure -work-area-phys 0x20002000

adapter speed 4000
