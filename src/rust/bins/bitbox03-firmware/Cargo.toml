[package]
name = "bitbox03-firmware"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/allocator.rs"
doctest = false

[[bin]]
name = "bitbox03-firmware"
path = "src/main.rs"
test = false
bench = false

[features]
board-stm32u5a9j-dk = [
    "dep:bitbox-board-stm32u5a9j-dk",
    "dep:bitbox-board-stm32u5a9j-dk-build",
]
rtt = ["bitbox-debug/rtt"]

[dependencies]
bitbox-board-stm32u5a9j-dk = { path = "../../bitbox-board-stm32u5a9j-dk", features = ["usb"], optional = true }
bitbox-usb = { path = "../../bitbox-usb" }
bitbox02-rust = { path = "../../bitbox02-rust" }
bitbox03 = { path = "../../bitbox03" }
bitbox-executor = { path = "../../bitbox-executor" }
critical-section = { workspace = true }
dlmalloc = "0.2.11"
static_cell = "2.1.0"
bitbox-mcu-stm32u5 = { path = "../../bitbox-mcu-stm32u5" }
bitbox-platform-stm32u5 = { path = "../../bitbox-platform-stm32u5" }
bitbox-debug = { path = "../../bitbox-debug" }
cortex-m-rt = "0.7"
cortex-m = { workspace = true }
log = { version = "0.4.22", default-features = false }

[dev-dependencies]
critical-section = { workspace = true, features = ["std"] }

[build-dependencies]
bitbox-board-stm32u5a9j-dk-build = { path = "../../bitbox-board-stm32u5a9j-dk-build", optional = true }
