[package]
name = "bitbox03-firmware"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bitbox03-firmware"
path = "src/main.rs"
test = false
bench = false

[features]
board-stm32u5a9j-dk = [
    "dep:bitbox-board-stm32u5a9j-dk",
    "dep:bitbox-board-stm32u5a9j-dk-build",
]
board-testboard = [
    "dep:bitbox-board-testboard",
    "dep:bitbox-board-testboard-build",
]
rtt = ["bitbox-debug/rtt"]

[dependencies]
bitbox-board-stm32u5a9j-dk = { path = "../../bitbox-board-stm32u5a9j-dk", optional = true }
bitbox-board-testboard = { path = "../../bitbox-board-testboard", optional = true }
bitbox-mcu-stm32u5 = { path = "../../bitbox-mcu-stm32u5" }
bitbox-platform-stm32u5 = { path = "../../bitbox-platform-stm32u5" }
bitbox-debug = { path = "../../bitbox-debug" }
cortex-m-rt = "0.7"
cortex-m = { workspace = true }
log = { version = "0.4.22", default-features = false }

[build-dependencies]
bitbox-board-stm32u5a9j-dk-build = { path = "../../bitbox-board-stm32u5a9j-dk-build", optional = true }
bitbox-board-testboard-build = { path = "../../bitbox-board-testboard-build", optional = true }
