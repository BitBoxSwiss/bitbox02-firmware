[package]
name = "bitbox-board-stm32u5g9j-tb"
version = "0.1.0"
edition = "2024"
authors = ["Shift Crypto AG <support@bitbox.swiss>"]
description = "Board-specific STM32U5G9 test board support for BitBox03"
license = "Apache-2.0"

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
bitbox-platform-stm32u5-sys = { path = "../bitbox-platform-stm32u5-sys", features = ["stm32u5g9"] }
embassy-stm32 = { version = "0.6.0", default-features = false, features = ["stm32u5g9zj"] }
