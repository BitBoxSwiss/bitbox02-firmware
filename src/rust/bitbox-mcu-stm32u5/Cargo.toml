# SPDX-License-Identifier: Apache-2.0

[package]
name = "bitbox-mcu-stm32u5"
version = "0.1.0"
edition = "2024"
authors = ["Shift Crypto AG <support@bitbox.swiss>"]
description = "Selected STM32U5 PAC for bitbox02-firmware"
license = "Apache-2.0"

[lib]
test = false
doctest = false

[features]
stm32u5a9 = ["dep:stm32u5"]
stm32u5g9 = ["dep:stm32-metapac"]

[dependencies]
stm32u5 = { version = "0.16", features = ["stm32u5a9"], optional = true }
stm32-metapac = { version = "21.0.0", features = ["stm32u5g9zj", "rt"], optional = true }
