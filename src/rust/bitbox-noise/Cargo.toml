# SPDX-License-Identifier: Apache-2.0

[package]
name = "bitbox-noise"
version = "0.1.0"
authors = ["Shift Crypto AG <support@bitbox.swiss>"]
edition = "2024"
description = "BitBox02 noise protocol primitives"
license = "Apache-2.0"

[dependencies.bitbox-hal]
path = "../bitbox-hal"

[dependencies.noise-protocol]
version = "0.2.0"
default-features = false
features = ["use_alloc"]

[dependencies.chacha20poly1305]
version = "0.11.0"
default-features = false
features = ["zeroize"]

# Wipe ChaCha's buffered keystream as well as its key.
[dependencies.cipher]
version = "0.5.2"
default-features = false
features = ["zeroize"]

[dependencies.sha2]
workspace = true

[dependencies.zeroize]
workspace = true

[dependencies.x25519-dalek]
version = "3.0.0"
default-features = false
features = ["static_secrets", "zeroize"]

[dev-dependencies.hex_lit]
workspace = true
