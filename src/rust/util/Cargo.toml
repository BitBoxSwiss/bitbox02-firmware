# SPDX-License-Identifier: Apache-2.0

[package]
name = "util"
version = "0.1.0"
authors = ["Shift Crypto AG <support@bitbox.swiss>"]
edition = "2024"
license = "Apache-2.0"

[dependencies]
num-bigint = { workspace = true, default-features = false }
rtt-target = { version = "0.6.2", optional = true }
cortex-m = { workspace = true }
hex = {workspace = true}
digest = { workspace = true }
hmac = { workspace = true }
p256 = { version = "0.13.2", default-features = false, features = ["arithmetic", "ecdsa"], optional = true }
ecdsa = { version = "0.16.9", default-features = false, features = ["signing"], optional = true }
bitcoin = { workspace = true }
critical-section = { workspace = true }
zeroize = { workspace = true }
time = { version = "0.3.44", default-features = false }

[dev-dependencies]
hex_lit = { workspace = true }
sha2 = { workspace = true }

[features]
p256 = ["dep:p256", "dep:ecdsa"]
sha2 = []
rtt = ["dep:rtt-target"]
testing = ["critical-section/std"]
c-unit-testing = ["critical-section/std"]
firmware = []
